      <a href="index.html" class="nav-brand-link">
        <span class="nav-brand-name">ATOMOS</span>
      </a>
    </div>
    <nav class="nav-links">

            id="bioSearchInput"
            class="bio-search-input"

          <button type="button" id="bioClearBtn" class="bio-input-clear hidden" aria-label="Clear Search">&times;</button>

        </div>

      <!-- Profile Container -->
      <div id="bioProfileContainer">
        <div style="text-align: center; padding: 48px 20px; color: rgba(255,255,255,0.5); font-family: var(--font-mono);">

      <div class="footer-tag">ATOMOS V1</div>
