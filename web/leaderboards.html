  <main class="subpage-container">
    <div class="subpage-card">
      <div class="subpage-title">
        <span>CIRCUIT LEADERBOARDS</span>
        <span class="badge-count" id="tierEligibilityBadge">TAB // MIN 12 ROUNDS</span>
      </div>

      <!-- Tabbycat Leaderboard Navigation Tabs & Mode Switcher -->
      <div class="subpage-tabs-bar">
        <div class="subpage-tabs" id="lbCategoryTabs">
          <button class="subpage-tab-btn active" data-tab="individual">Individual</button>
          <button class="subpage-tab-btn" data-tab="teams">Teams</button>
          <button class="subpage-tab-btn" data-tab="institutions">Institutions</button>
          <button class="subpage-tab-btn" data-tab="tournaments">Tournaments</button>
          <button class="subpage-tab-btn" data-tab="adjudicators">Adjudicators</button>
        </div>

        <!-- Universal Tier Switcher: Tab (Default) vs General Tab -->
        <div class="subpage-mode-switcher" id="tierModeSwitcher" aria-label="Leaderboard Tier">
          <button class="mode-switch-btn active" data-tier="tab">TAB</button>
          <button class="mode-switch-btn" data-tier="general">GENERAL TAB</button>
        </div>
      </div>

      <!-- Dynamic Metric Switcher Toolbar for Active Category -->
      <div class="metric-toolbar-wrap" id="lbMetricToolbar" style="margin-bottom: 14px;">
        <!-- Injected dynamically via JS based on category -->
      </div>

      <!-- Search Bar -->
      <div class="filter-bar">
        <input
          type="text"
          id="lbSearchInput"
          class="filter-input"
          placeholder="Filter by name or institution..."
        />
      </div>

      <!-- Dynamic Data Table -->
      <div id="lbTableContainer">
        <div style="text-align: center; padding: 40px; color: #d8eef9; font-weight: 500; font-family: var(--font-mono);">Loading leaderboard...</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="atomos-footer">
      <div class="footer-tag">ATOMOS V3</div>
    </footer>
