  <main class="subpage-container">
    <div class="subpage-card">
      <div class="subpage-title" style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>ATOMOS AI ASSISTANT</span>
          <span class="badge-count" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">CIRCUIT DATA & GEMINI</span>
        </div>
        <button id="clearChatBtn" class="quick-chip" style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; cursor: pointer; padding: 4px 12px; font-size: 11px; font-weight: 700; border-radius: 6px; letter-spacing: 0.04em;">CLEAR CHAT</button>
      </div>

      <!-- Chat Window -->
      <div class="chat-window">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble bot">
            <strong>Atomos:</strong> Hi! I am Atomos, your circuit debate analyst. Ask me anything about debaters, teams, tournaments, or rankings.
          </div>
        </div>

        <!-- Suggestion Chips -->
        <div class="quick-chips-row">
          <button class="quick-chip" onclick="window.AtomosApp.sendChatPrompt('Who is ranked #1 on the circuit?')">Who is ranked #1?</button>
          <button class="quick-chip" onclick="window.AtomosApp.sendChatPrompt('What is Balishta Wijesinghe\'s career record?')">Balishta's record?</button>
          <button class="quick-chip" onclick="window.AtomosApp.sendChatPrompt('List all National Pool Direct debaters.')">National Pool Direct list</button>
          <button class="quick-chip" onclick="window.AtomosApp.sendChatPrompt('Tell me about the closeout at Law Fac.')">Law Fac closeout</button>
        </div>

        <!-- Chat Input Bar -->
        <div class="chat-input-bar">
          <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Ask Atomos AI anything about debaters, ballots, closeouts, or stats..."
          />
          <button class="chat-send-btn" id="chatSendBtn">SEND</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="atomos-footer">
      <div class="footer-tag">ATOMOS V2.5</div>
    </footer>
