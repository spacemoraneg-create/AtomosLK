<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

</head>
<body>

  <!-- Top Tabbycat-style Navigation Bar -->
  <header class="tabby-nav">
    <div class="nav-brand">
      <a href="index.html" class="nav-brand-link">
        <span class="nav-brand-name">ATOMOS</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">HOME</a>
      <a href="leaderboards.html" class="nav-link">LEADERBOARDS</a>
      <a href="bio.html" class="nav-link">DEBATER BIO</a>
      <a href="team_bio.html" class="nav-link">TEAM BIO</a>
      <a href="institution_bio.html" class="nav-link">INSTITUTION BIO</a>
      <a href="adjudicator_bio.html" class="nav-link">ADJUDICATOR BIO</a>
      <a href="h2h.html" class="nav-link active">HEAD TO HEAD</a>
      <a href="pool.html" class="nav-link">POOL</a>
      <a href="chat.html" class="nav-link">AI CHATBOT</a>
      <a href="admin.html" class="nav-link">ADMIN</a>
    </nav>
  </header>

  <main class="subpage-container">
    <div class="subpage-card">
      <div class="subpage-title">
        <span>HEAD TO HEAD COMPARISON</span>
        <span class="badge-count" style="background: rgba(239, 68, 68, 0.2); color: #f87171;">6 CORE METRICS</span>
      </div>

      <!-- Contender Selection Row -->
      <div class="h2h-select-row">
        <!-- Contender 1 Box -->
        <div class="h2h-contender-box h2h-contender-1">
          <div class="h2h-contender-header">
            <span class="h2h-contender-label" style="color: #7692ff;">CONTENDER 1</span>
            <span id="h2hSelectedBadgeA" class="h2h-selected-pill hidden"></span>
          </div>
          <div class="h2h-search-wrap">
            <input
              type="text"
              id="h2hInputA"
              class="h2h-search-input"
              placeholder="Search debater by name or school..."
              autocomplete="off"
              aria-label="Search Contender 1"
            />
            <button type="button" id="h2hClearBtnA" class="h2h-input-clear hidden" aria-label="Clear Contender 1">&times;</button>
            <div id="h2hDropdownA" class="h2h-autocomplete-list hidden"></div>
          </div>
        </div>

        <div class="h2h-vs-badge">VS</div>

        <!-- Contender 2 Box -->
        <div class="h2h-contender-box h2h-contender-2">
          <div class="h2h-contender-header">
            <span class="h2h-contender-label" style="color: #f43f5e;">CONTENDER 2</span>
            <span id="h2hSelectedBadgeB" class="h2h-selected-pill hidden"></span>
          </div>
          <div class="h2h-search-wrap">
            <input
              type="text"
              id="h2hInputB"
              class="h2h-search-input"
              placeholder="Search debater by name or school..."
              autocomplete="off"
              aria-label="Search Contender 2"
            />
            <button type="button" id="h2hClearBtnB" class="h2h-input-clear hidden" aria-label="Clear Contender 2">&times;</button>
            <div id="h2hDropdownB" class="h2h-autocomplete-list hidden"></div>
          </div>
        </div>
      </div>

      <!-- Results Container -->
      <div id="h2hResultContainer">
        <!-- Rendered dynamically via app.js -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="atomos-footer">
      <div class="footer-tag">ATOMOS V2.5</div>
    </footer>
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
